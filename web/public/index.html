<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SF Agents">
<title>SF Agents</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/sfgl/fonts/host-grotesk/host-grotesk.css">
<link rel="stylesheet" href="vendor/sfgl/src/css/sfgl.css">
<link rel="stylesheet" href="vendor/sfgl/src/ui/ui.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="files.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="chat" id="chat" tabindex="-1">
    <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>
  </div>

  <nav class="rail" id="rail" tabindex="0" role="listbox" aria-label="Topics: press and hold, or press Enter, to choose a topic" hidden>
    <div class="rail-dots" id="railDots" aria-hidden="true"></div>
    <div class="rail-list" id="railList"></div>
  </nav>

  <!-- The bar's sheet content; the main bar (sfgl createSheet) takes it in when it starts. -->
  <div class="sheet-scroll" id="sheetScroll" hidden>
    <div class="tools-row">
      <section class="monitor loading" id="monitor" data-glass="tile" aria-label="System resources">
        <header class="mon-head above">
          <button class="mon-expand" id="monExpand" type="button" aria-label="Open Files"></button>
          <span class="mon-title"><span class="mon-host">This computer</span><i data-symbol="desktopcomputer"></i></span>
        </header>
        <div class="mon-stats above"></div>
        <div class="mon-drives above" aria-label="Drives" hidden></div>
      </section>
      <div class="side-buttons" id="sideButtons"></div>
    </div>

    <h2 class="section-head above"><span>Pinned</span><i data-symbol="pin.fill" class="head-pin"></i></h2>
    <div class="tiles above" id="pinned"></div>
    <p class="empty above" id="pinnedEmpty">Pin an artifact to keep it here.</p>

    <hr class="divider above">

    <div class="tiles above" id="allArtifacts"></div>
    <p class="empty above" id="allEmpty">Artifacts the agent creates will appear here.</p>
  </div>

  <input type="file" id="picker" multiple hidden>
  <div class="drop-hint above" id="dropHint" hidden><span>Drop files to attach</span></div>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <header class="viewer-head">
    <button class="viewer-btn sf-press" id="viewerClose" type="button" aria-label="Close"><i data-symbol="xmark"></i></button>
    <div class="viewer-title"><strong id="viewerTitle"></strong><span id="viewerMeta"></span></div>
    <button class="viewer-btn sf-press" id="viewerPin" type="button" aria-label="Pin" aria-pressed="false"><i data-symbol="pin"></i></button>
    <a class="viewer-btn sf-press" id="viewerOpen" target="_blank" rel="noopener" aria-label="Open in a new tab"><i data-symbol="arrow.up.right.square"></i></a>
    <a class="viewer-btn sf-press" id="viewerDownload" aria-label="Download"><i data-symbol="square.and.arrow.down"></i></a>
  </header>
  <div class="viewer-body" id="viewerBody"></div>
</div>


<script type="module" src="app.js"></script>
</body>
</html>
