<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SF Agents">
<title>SF Agents</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/sfgl/fonts/host-grotesk/host-grotesk.css">
<link rel="stylesheet" href="vendor/sfgl/src/css/sfgl.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="files.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="chat" id="chat" tabindex="-1">
    <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>
  </div>

  <nav class="rail" id="rail" tabindex="0" role="listbox" aria-label="Topics: press and hold, or press Enter, to choose a topic" hidden>
    <div class="rail-dots" id="railDots" aria-hidden="true"></div>
    <div class="rail-list" id="railList"></div>
  </nav>

  <section class="bar" id="bar" data-state="collapsed" aria-label="Message and artifacts">
    <div class="bar-fill" aria-hidden="true"></div>
    <button class="grabber above" id="grabber" type="button" aria-label="Show artifacts" aria-expanded="false"><span></span></button>

    <div class="row above" id="row">
      <div class="field" id="field">
        <div class="attachments above" id="attachments" hidden></div>
        <div class="field-line above">
          <button class="icon-btn above" id="attach" type="button" aria-label="Add photos or files"><i data-symbol="plus"></i></button>
          <textarea class="input above" id="input" rows="1" placeholder="Message" aria-label="Message" autocomplete="off" spellcheck="true" enterkeyhint="send"></textarea>
          <button class="icon-btn above" id="mic" type="button" aria-label="Dictate"><i data-symbol="mic.fill"></i></button>
        </div>
      </div>
      <button class="circle" id="send" type="button" aria-label="Agent" aria-haspopup="dialog">
        <span class="agent-icon above" aria-hidden="true"><svg viewBox="0 0 170 120" width="24" height="17"><defs><mask id="agentFace" maskUnits="userSpaceOnUse" x="0" y="0" width="170" height="120"><path fill="#fff" d="M24 8H144V48H164V68H144V92H134V114H120V92H110V114H96V92H72V92H58V114H44V92H34V114H20V92H24V68H4V48H24Z"/><rect x="48" y="32" width="11" height="20" rx="3"/><path d="M105 42L116 36L125 42" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 62Q84 72 92 62" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/></mask></defs><path fill="currentColor" mask="url(#agentFace)" d="M0 0H170V120H0Z"/></svg></span>
        <span class="send-icon above" aria-hidden="true" hidden><i data-symbol="arrow.up"></i></span>
        <span class="stop-disc above" aria-hidden="true"><i data-symbol="stop.fill"></i></span>
      </button>
    </div>

    <div class="sheet-scroll above" id="sheetScroll">
      <div class="tools-row">
        <section class="monitor loading" id="monitor" aria-label="System resources">
          <header class="mon-head above">
            <button class="mon-expand" id="monExpand" type="button" aria-label="Open Files"><span class="above" aria-hidden="true"><i data-symbol="arrow.up.left.and.arrow.down.right"></i></span></button>
            <span class="mon-title"><span class="mon-host">This computer</span><i data-symbol="desktopcomputer"></i></span>
          </header>
          <div class="mon-stats above"></div>
          <div class="mon-drives above" aria-label="Drives" hidden></div>
        </section>
        <div class="side-buttons">
          <button class="circle side" id="settingsBtn" type="button" aria-label="Settings" aria-haspopup="dialog"><span class="side-icon above" aria-hidden="true"><i data-symbol="gear" data-size="23"></i></span></button>
          <button class="circle side" id="terminalBtn" type="button" aria-label="Terminal" aria-haspopup="dialog"><span class="side-icon above" aria-hidden="true"><svg class="term-glyph" viewBox="0 0 24 24" width="22" height="22"><rect x="2.5" y="4" width="19" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M7 9.5l3 2.5-3 2.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 15h4.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span></button>
          <button class="circle side" id="searchBtn" type="button" aria-label="Search messages and artifacts" aria-haspopup="dialog"><span class="side-icon above" aria-hidden="true"><i data-symbol="magnifyingglass" data-size="21"></i></span></button>
        </div>
      </div>

      <h2 class="section-head above"><span>Pinned</span><i data-symbol="pin.fill" class="head-pin"></i></h2>
      <div class="tiles above" id="pinned"></div>
      <p class="empty above" id="pinnedEmpty">Pin an artifact to keep it here.</p>

      <hr class="divider above">

      <div class="tiles above" id="allArtifacts"></div>
      <p class="empty above" id="allEmpty">Artifacts the agent creates will appear here.</p>
    </div>
  </section>

  <input type="file" id="picker" multiple hidden>
  <div class="drop-hint above" id="dropHint" hidden><span>Drop files to attach</span></div>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <header class="viewer-head">
    <button class="viewer-btn" id="viewerClose" type="button" aria-label="Close"><i data-symbol="xmark"></i></button>
    <div class="viewer-title"><strong id="viewerTitle"></strong><span id="viewerMeta"></span></div>
    <button class="viewer-btn" id="viewerPin" type="button" aria-label="Pin" aria-pressed="false"><i data-symbol="pin"></i></button>
    <a class="viewer-btn" id="viewerOpen" target="_blank" rel="noopener" aria-label="Open in a new tab"><i data-symbol="arrow.up.right.square"></i></a>
    <a class="viewer-btn" id="viewerDownload" aria-label="Download"><i data-symbol="square.and.arrow.down"></i></a>
  </header>
  <div class="viewer-body" id="viewerBody"></div>
</div>


<script type="module" src="app.js"></script>
</body>
</html>
