[package]
name = "sfagents-sandbox"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "SF Agents Windows shell sandbox helper: dedicated low-privilege user, restricted token, workspace ACLs, Job Object cleanup, private desktop and per-user firewall for the shell tool."
publish = false

[[bin]]
name = "sfagents-sandbox"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Console",
  "Win32_System_WindowsProgramming",
  "Win32_Graphics_Gdi",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_RemoteDesktop",
  "Win32_System_JobObjects",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemServices",
  "Win32_System_Environment",
  "Win32_NetworkManagement_NetManagement",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_System_Rpc",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
]
