# SF Agents' distro. Windows drives are not mounted (SF Agents mounts the
# agents' folders read-only itself), and Linux cannot start Windows programs.
[boot]
systemd=true

[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[user]
default=root

[network]
hostname=sfagents
generateResolvConf=true
